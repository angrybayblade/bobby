# Release: pushing a version tag (1.2.3; a hyphen, as in 1.2.3-rc0, makes a pre-release) builds standalone bobby
# binaries for every platform and publishes them, with checksums, as a GitHub release.
#
#   git tag 0.2.0 && git push origin 0.2.0
#
# The tag must be exactly "version" in package.json, with no leading v: the assets are named after the tag, and every
# `bobby update` already installed looks for them by the bare version. A v tag still runs this, to fail loudly. Bun cross-compiles every target, so one Linux runner
# builds them all.
name: release

on:
  push:
    tags: ["v[0-9]*", "[0-9]*"]

# Actions are pinned to a commit, not a tag a compromised action could move. Nothing may write but the release job.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the build provenance
      attestations: write # and record it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no later step needs git to push

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME isn't package.json's version, $version: tag it exactly $version, with no leading v"
            exit 1
          fi

      - name: Typecheck and syntax-check
        run: bun run check

      - name: Build binaries
        run: bun run build --all

      - name: Smoke-test the Linux binary
        run: |
          test "$(./dist/bobby-linux-x64 --version)" = "${GITHUB_REF_NAME#v}"
          ./dist/bobby-linux-x64 --help | head -1

      # One archive per platform, each holding a binary called bobby (bobby.exe on Windows).
      - name: Package
        run: |
          mkdir -p release
          for bin in dist/bobby-*; do
            target="$(basename "$bin" .exe)"
            target="${target#bobby-}"
            stage="$(mktemp -d)"
            case "$target" in
              windows-*)
                cp "$bin" "$stage/bobby.exe"
                cp README.md LICENSE THIRD_PARTY_NOTICES.md "$stage/"
                (cd "$stage" && zip -q "$GITHUB_WORKSPACE/release/bobby-$GITHUB_REF_NAME-$target.zip" bobby.exe README.md LICENSE THIRD_PARTY_NOTICES.md)
                ;;
              *)
                cp "$bin" "$stage/bobby"
                chmod +x "$stage/bobby"
                cp README.md LICENSE THIRD_PARTY_NOTICES.md "$stage/"
                tar -C "$stage" -czf "release/bobby-$GITHUB_REF_NAME-$target.tar.gz" bobby README.md LICENSE THIRD_PARTY_NOTICES.md
                ;;
            esac
          done
          (cd release && sha256sum * > SHA256SUMS)
          ls -lh release

      # Signed provenance for each archive: who built it, from which commit, by which workflow. Check one with
      # gh attestation verify <archive> --repo angrybayblade/bobby
      - name: Attest the build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "release/bobby-*"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Bobby $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $flags
