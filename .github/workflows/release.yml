# Release: pushing a version tag (v1.2.3, or v1.2.3-rc.1 for a pre-release) builds standalone bobby
# binaries for every platform and publishes them, with checksums, as a GitHub release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag must match "version" in package.json. Bun cross-compiles every target, so one Linux runner
# builds them all.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - name: Typecheck and syntax-check
        run: bun run check

      - name: Build binaries
        run: bun run build --all

      - name: Smoke-test the Linux binary
        run: |
          test "$(./dist/bobby-linux-x64 --version)" = "${GITHUB_REF_NAME#v}"
          ./dist/bobby-linux-x64 --help | head -1

      # One archive per platform, each holding a binary called bobby (bobby.exe on Windows).
      - name: Package
        run: |
          mkdir -p release
          for bin in dist/bobby-*; do
            target="$(basename "$bin" .exe)"
            target="${target#bobby-}"
            stage="$(mktemp -d)"
            case "$target" in
              windows-*)
                cp "$bin" "$stage/bobby.exe"
                cp README.md "$stage/"
                (cd "$stage" && zip -q "$GITHUB_WORKSPACE/release/bobby-$GITHUB_REF_NAME-$target.zip" bobby.exe README.md)
                ;;
              *)
                cp "$bin" "$stage/bobby"
                chmod +x "$stage/bobby"
                cp README.md "$stage/"
                tar -C "$stage" -czf "release/bobby-$GITHUB_REF_NAME-$target.tar.gz" bobby README.md
                ;;
            esac
          done
          (cd release && sha256sum * > SHA256SUMS)
          ls -lh release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Focus Bobby $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $flags
