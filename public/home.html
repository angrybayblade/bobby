<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bobby</title>
  <link rel="icon" href="/bobby.svg" type="image/svg+xml" />
  <script>/* your style and theme from the first paint (main.js and home.js remember them), not the defaults */
    try { const l = JSON.parse(localStorage.getItem("bobby.look") || "null"), r = document.documentElement;
      if (l) { r.dataset.palette = ["warm", "silverpoint"].includes(l.palette) ? l.palette : "github"; r.dataset.theme = l.theme === "system" || !l.theme ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : l.theme; }
    } catch {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" />
  <link rel="stylesheet" href="/app/theme.css" />
  <style>
    /* The home page: one column, the box to paste a PR into, then the lists. Shares theme.css's tokens with reviews. */
    body.home { display: block; overflow: auto; height: auto; min-height: 100%; }
    /* the header and the search stay put; the lists scroll under them */
    .home .wrap .top { position: sticky; top: 0; z-index: 20; margin: -22px 0 0; padding: 22px 0 12px; background: var(--bg); border-bottom: 1px solid var(--line-soft, var(--line)); }
    .home .wrap .row { scroll-margin: 140px 0 16px; } /* moved to with ↑ ↓: clear of the bar */
    .home .wrap { max-width: 980px; margin: 0 auto; padding: 22px 24px 80px; }
    .home .wrap header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .home .wrap header .ver { color: var(--faint); font-size: 12px; }
    .home .wrap header .grow { flex: 1; }
    /* One row: a box that opens a pasted PR or searches titles, then repo and author, then refresh. */
    .home .wrap .tools { display: flex; gap: 6px; align-items: center; }
    .home .wrap .box { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; }
    .home .wrap .box svg { position: absolute; left: 10px; color: var(--faint); pointer-events: none; }
    .home .wrap .box input { flex: 1; min-width: 0; height: 32px; padding: 0 64px 0 32px; font: 13.5px var(--font-ui); color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
    .home .wrap .box input:focus { outline: none; border-color: var(--focus, var(--signal)); }
    .home .wrap .box .go { position: absolute; right: 5px; height: 22px; padding: 0 8px; border-radius: 3px; font: 500 12px var(--font-ui); color: var(--signal-ink); background: var(--signal); }
    .home .wrap .box .go[hidden] { display: none; }
    .home .wrap .tools select { height: 32px; max-width: 190px; padding: 0 26px 0 10px; font: 13px var(--font-ui); color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; appearance: none; cursor: pointer;
      background-image: linear-gradient(45deg, transparent 50%, var(--faint) 50%), linear-gradient(135deg, var(--faint) 50%, transparent 50%); background-position: calc(100% - 13px) 14px, calc(100% - 9px) 14px; background-size: 4px 4px; background-repeat: no-repeat; }
    .home .wrap .tools select.on { color: var(--text); border-color: var(--muted); }
    .home .wrap .tools select:focus { outline: none; border-color: var(--focus, var(--signal)); }
    .home .wrap .tools .reload { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 4px; color: var(--faint); display: grid; place-items: center; }
    .home .wrap .tools .reload:hover { color: var(--text); border-color: var(--muted); }
    .home .wrap .tools .reload.spin svg { animation: spin .8s linear infinite; }
    .home .wrap .err { color: var(--risk); font-size: 12.5px; margin: 6px 2px 0; }
    .home .wrap .err:empty { display: none; }
    @media (max-width: 640px) { .home .wrap .tools { flex-wrap: wrap; } .home .wrap .box { flex-basis: 100%; } .home .wrap .tools select { flex: 1; max-width: none; } }
    .home .wrap section { margin-top: 22px; }
    .home .wrap h2 { font: 600 12px var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 0 0 8px; display: flex; gap: 8px; }
    .home .wrap h2 .n { color: var(--muted); font-weight: 500; }
    .home .wrap .none { color: var(--faint); font-size: 13px; padding: 8px 2px; }
    .home .wrap .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 9px 12px; border: 1px solid transparent; border-bottom-color: var(--line-soft, var(--line)); text-decoration: none; color: inherit; }
    .home .wrap .row:hover, .home .wrap .row.sel { background: var(--raised); }
    .home .wrap .row.sel { border-color: var(--line); border-radius: 3px; }
    .home .wrap .row .t { min-width: 0; display: flex; align-items: baseline; white-space: nowrap; } /* the title gives way, not its tags */
    .home .wrap .row .tt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .home .wrap .row .t b { font-weight: 600; }
    .home .wrap .row .where { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .home .wrap .row .side { display: flex; gap: 12px; align-items: center; justify-content: flex-end; color: var(--faint); font-size: 12px; white-space: nowrap; }
    .home .wrap .row .meta { grid-column: 2; grid-row: 2; }
    .home .wrap .tag { font: 500 11px var(--font-ui); padding: 1px 6px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); margin-left: 6px; flex: none; }
    .home .wrap .tag.live { border-color: var(--ok); color: var(--ok); }
    .home .wrap .tag.draft { border-style: dashed; }
    .home .wrap .sha { font: 12px var(--font-code); color: var(--muted); margin-right: 6px; }
    .home .wrap .bar { width: 64px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
    .home .wrap .bar i { display: block; height: 100%; background: var(--ok); }
    .home .wrap .av { width: 16px; height: 16px; border-radius: 50%; vertical-align: -3px; margin-right: 4px; }
    .home .wrap .keys { color: var(--faint); font-size: 12px; margin-top: 30px; }
    .home .wrap .busy { opacity: .55; pointer-events: none; }
    /* a row's menu (right-click, or shift+F10 / the menu key on the selected row) */
    .home .wrap .menu { position: fixed; z-index: 30; min-width: 200px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); font-size: 13px; }
    .home .wrap .menu[hidden] { display: none; }
    .home .wrap .menu button { display: flex; width: 100%; gap: 16px; justify-content: space-between; padding: 6px 10px; border-radius: 3px; text-align: left; color: var(--text); }
    .home .wrap .menu button:hover, .home .wrap .menu button:focus { outline: none; background: var(--raised); }
    .home .wrap .menu button kbd { color: var(--faint); font: 11.5px var(--font-ui); }
    .home .wrap .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
  </style>
  <script type="module" src="/app/home.js"></script>
</head>
<body class="home">
  <div class="wrap">
    <div class="top">
    <header>
      <span class="brand"><img src="/bobby.svg" alt="" width="22" height="22">bobby</span>
      <span class="ver"></span>
      <span class="grow"></span>
      <span class="release"></span>
      <button class="pill ghsetup" type="button" hidden>Set up GitHub</button>
      <button class="pill claude" type="button" hidden>Set up Claude</button>
    </header>
    <form class="tools" autocomplete="off" role="search">
      <label class="box">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M10.68 11.74a6 6 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 1 1-1.06 1.06ZM11.5 7a4.5 4.5 0 1 0-9 0 4.5 4.5 0 0 0 9 0Z"/></svg>
        <input name="q" placeholder="Search titles, or paste a PR link to review it" aria-label="Search titles, or a pull request link to review" autofocus />
        <button class="go" type="submit" hidden title="Review this PR">↵ open</button>
      </label>
      <select name="repo" aria-label="Repository"><option value="">All repos</option></select>
      <select name="author" aria-label="Author"><option value="">Anyone</option></select>
      <button type="button" class="reload" title="Ask GitHub again" aria-label="Refresh the lists"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M1.7 7.25a6.3 6.3 0 0 1 11.12-3.6V2.25a.75.75 0 0 1 1.5 0V5.5a.75.75 0 0 1-.75.75H10.3a.75.75 0 0 1 0-1.5h1.42A4.8 4.8 0 0 0 3.2 7.33a.75.75 0 1 1-1.5-.08Zm12.58 1.5a.75.75 0 0 1 .7.8 6.3 6.3 0 0 1-11.12 2.8v1.4a.75.75 0 0 1-1.5 0V10.5a.75.75 0 0 1 .75-.75H5.7a.75.75 0 0 1 0 1.5H4.28a4.8 4.8 0 0 0 8.52-2.58.75.75 0 0 1 .8-.7Z"/></svg></button>
    </form>
    </div>
    <div class="err" role="alert"></div>
    <div class="lists"></div>
    <div class="keys"><kbd>/</kbd> search or paste a link · <kbd>↑</kbd> <kbd>↓</kbd> move · <kbd>enter</kbd> open · <kbd>o</kbd> on GitHub · <kbd>⇧F10</kbd> or right-click: more</div>
    <div class="menu" role="menu" hidden></div>
  </div>
</body>
</html>
