<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bobby</title>
  <link rel="icon" href="/bobby.svg" type="image/svg+xml" />
  <script>/* your style and theme from the first paint (main.js and home.js remember them), not the defaults */
    try { const l = JSON.parse(localStorage.getItem("bobby.look") || "null"), r = document.documentElement;
      if (l) { r.dataset.palette = ["warm", "silverpoint"].includes(l.palette) ? l.palette : "github"; r.dataset.theme = l.theme === "system" || !l.theme ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : l.theme; }
    } catch {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" />
  <link rel="stylesheet" href="/app/theme.css" />
  <script src="/vendor/highlight.min.js"></script> <!-- highlight.js 11.9.0 (BSD-3-Clause), shipped with Bobby: it runs beside its API, so not from a CDN -->
</head>
<body class="booting">
  <header id="top"><a class="brand" href="/" title="Home: your PRs and recent reviews"><img src="/bobby.svg" alt="" width="22" height="22">bobby</a></header>
  <nav id="where" aria-label="You are here"></nav>
  <main id="view"></main>
  <aside id="files" aria-label="Files changed" hidden></aside>
  <footer id="keys"></footer>
  <div id="overlay" hidden></div>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
